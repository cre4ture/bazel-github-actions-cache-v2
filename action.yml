name: Bazel GitHub Actions Cache v2
description: Run a loopback-only Bazel HTTP remote cache backed by GitHub Actions cache v2
author: cre4ture
branding:
  icon: database
  color: green
inputs:
  write:
    description: "auto writes only on default-branch pushes; true enables trusted non-fork workflows; false is read-only"
    required: false
    default: auto
  fail-on-cache-error:
    description: "Fail Bazel requests when GitHub cache is unavailable instead of degrading to misses/soft upload success"
    required: false
    default: "false"
  key-prefix:
    description: "Immutable GitHub cache-key namespace; change it to invalidate all entries"
    required: false
    default: bazel-http-v1
  storage-mode:
    description: "objects keeps the v0.2 object-per-entry format; packs enables CARv2 packs and manifest DAGs"
    required: false
    default: objects
  pack-size-mb:
    description: "Target CARv2 pack size in MiB when storage-mode is packs (1-32)"
    required: false
    default: "8"
  pack-flush-seconds:
    description: "Maximum seconds that staged CARv2 objects wait before publication"
    required: false
    default: "30"
  max-manifests:
    description: "Maximum immutable manifest entries to discover through the GitHub Actions REST API"
    required: false
    default: "2048"
  github-token:
    description: "GitHub token with actions: read, used only by storage-mode=packs to discover manifest cache keys"
    required: false
    default: ${{ github.token }}
  max-blob-size-mb:
    description: "Maximum accepted or downloaded AC/CAS object size"
    required: false
    default: "512"
  max-concurrent-operations:
    description: "Maximum concurrent GitHub cache operations"
    required: false
    default: "4"
  max-uploads-per-minute:
    description: "Evenly spaced upload limit; must stay below GitHub's 200/minute limit"
    required: false
    default: "180"
  backend-timeout-seconds:
    description: "Timeout for one GitHub cache operation and initial packed-manifest discovery"
    required: false
    default: "300"
  port:
    description: "Loopback port; zero selects an available dynamic port"
    required: false
    default: "0"
outputs:
  url:
    description: "Loopback Bazel HTTP remote-cache URL"
  stats-url:
    description: "Loopback JSON statistics endpoint available until the post-step"
  writable:
    description: "Whether validated objects are published to GitHub Actions cache"
  bazel-args:
    description: "Ready-to-use --remote_cache and --remote_upload_local_results flags"
  initial-stats:
    description: "Initial statistics JSON"
  final-stats:
    description: "Final statistics JSON emitted during post cleanup; also written to the job summary"
runs:
  using: node24
  main: action/main.js
  post: action/post.js
  post-if: always()
