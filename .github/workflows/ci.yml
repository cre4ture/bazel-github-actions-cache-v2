name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Go tests with race detector
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Node wrapper tests
        run: node --test action/*.test.js
      - name: Actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Rebuild packaged binaries
        env:
          VERSION: v0.3.1
        run: scripts/build-dist.sh
      - name: Verify packaged binaries are reproducible
        run: git diff --exit-code -- dist
